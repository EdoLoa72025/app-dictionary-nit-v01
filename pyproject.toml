[project]
name = "auxiliar-terceros-mongodb"
version = "1.0.0"
description = "Streamlit app for normalizing accounting third-party auxiliary XLSX files into MongoDB."
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "dnspython>=2.8.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"